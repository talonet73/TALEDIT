name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: TALedit-Windows-Installer
          path: release/TALedit-Setup-*.exe
          if-no-files-found: error
      - name: Publish Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "desktop-v${VERSION}-build.${GITHUB_RUN_NUMBER}" \
            release/TALedit-Setup-*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TALedit ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Installer Windows a 64 bit. Include logo TALedit, collegamenti desktop e menu Start, finestra desktop dedicata e FFmpeg. Installer non firmato." \
            --latest
